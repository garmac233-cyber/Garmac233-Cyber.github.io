 ['LRLR','家连在一起，舒服留在身边','你偏爱相连的生活区域，也喜欢有靠的停留位置。材色彼此合拍，夜间的光停在身边，让一处日常位置有了自己的范围。','饭后走到一处有靠的位置坐下，面前仍与日常生活相连。边界只需要落在让人舒服的一侧，不必把这个位置单独围起来。','夜里让身边亮些、背景柔暗些。眼前的颜色与材质继续衔接，光的范围提示着：这一刻，可以在这里多待一会儿。'],
 ['LRRL','靠着坐下，也看见自己的偏爱','日常活动相连，停留时身边有靠。在柔和铺开的光里，搭配中的一处材色差别让这个位置更有辨识度。','从餐桌走到休息位，仍在同一片生活区域。坐下时身后或一侧有靠，眼前那一处喜欢的颜色或材质正好进入视线。','夜间不必把其他区域暗下去，身边与周围都可以柔和清楚。先看整体，再留一个想突出的材色重点。'],
 ['LRRR','有靠、有重点，也有自己的光','你喜欢日常连在一起，也想让停留的位置被轻轻界定。局部依靠、材色重点和夜间明暗，共同让这里成为一处鲜明的日常片段。','吃过饭，走到想歇着的位置。身后或一侧有靠，面前仍与客餐区域相连，喜欢的材色成为眼前的一处重点。','入夜后，光留在这一带，背景柔暗下来。先比较靠坐、材色与光各自的作用，让它们相互配合，而不必都集中在同一个物件上。'],
 ['RLLL','每处各有安排，坐下仍然舒展','你喜欢不同活动各有好认的位置，到了停留的地方，近旁又留得开。相互呼应的材色和柔和铺开的光，让各处保持联系。','饭后从餐位转到休息位，家具朝向或地面的变化提示着用途已经不同。坐下时，近旁仍留有起身、转身的余量。','到了夜里，各处柔和地亮着。材色彼此呼应，用途可以分清，整个家看起来仍然完整。'],

 ['RLRR','走到喜欢的那一处，让画面亮起来','不同活动各有位置，坐下时身边仍留开。材色有重点，夜间有明暗；换一个停留点，眼前的画面也跟着变化。','饭后换到休息位，家具朝向让这一处有自己的使用范围。近旁留开，视线可以停在一处喜欢的颜色或材质上。','夜里，光留在停留的位置，背景柔暗些。区域、材色与光共同形成变化，走动路线仍然清楚。'],
 ['RRLL','来到歇着的地方，稳稳坐下','你喜欢不同活动各有安排，休息的位置也有近旁依靠。材色相互呼应，柔和的光铺开，让每一处都有清楚又连贯的日常感。','从餐位走到休息位，家具组合提示着这里是另一处用途。坐下时，身后或一侧有靠，面前留着余地。','入夜后，整个停留区域柔和地亮着。相融的材色把不同位置接起来，各处有区分，也有彼此呼应的部分。'],
 ['RRLR','走到自己的角落，让光陪着歇一会儿','你偏爱用途清楚、有靠的停留位置。相互呼应的材色让画面完整，夜间的光留在身边，背景柔暗一些。','饭后走到留给休息的那一处。通过家具朝向形成一点过渡，坐下时身后或侧边有靠，面前仍有可活动的余量。','夜里让身边亮一些，周围柔暗下来。材色衔接得顺，光与近旁边界一起说明这里适合停一会儿。'],
 ['RRRL','每一处喜欢，都有能靠坐的位置','你喜欢用途分明，也想有一处可依靠的停留位置。搭配中留一个材色重点，夜里的光柔和铺开，喜欢的画面就在日常之中。','从吃饭的位置走到休息的位置，先感到用途的变化。坐下时身边有靠，面前那一处材色差别让这个位置更有自己的样子。','到了夜里，周围保持柔和清楚。重点可以落在局部颜色或材质上，其他安排围绕实际使用慢慢确定。'],
 ['RRRR','把喜欢的那一幕，留在自己的角落','活动各有一处，停留时身边有靠；材色有可辨认的重点，夜间明暗也有层次。喜欢的画面围绕着一处舒服的停留展开。','饭后走到想歇着的地方，家具组合让这里有自己的范围。身后或一侧有所依靠，面前留着余地，眼前有一处材色重点。','夜里让停留处更亮、背景柔暗。边界、材色和光各自起作用，具体哪一处更突出，可以放在同一幅搭配里一起比较。']

return{VERSION,axes,groups,profiles,get,differences};

在一片空间里，饭后顺势走过去歇一会儿"},{"id":"connection-R","label":"一处一景","headline":"吃饭和休息，各有一处。","description":"经过门洞或转折，起居区有自己的边界，吃饭和休息各有一处。","look":"看宽开口怎样框出后方的起居区域。","ref":8,"sentence":"餐位与起居区通过门洞或转折分开，吃饭和休息各有一处"}]},{"id":"enclosure","number":"02","name":"坐在哪里舒服","term":"停留围合","intro":"坐下来时，有人喜欢身边留开，有人喜欢身后和一侧有依靠。","scope":"看座位附近的边界。","boundary":"这一维只讲坐下的位置。靠边坐可以发生在大客厅里，周围留开也不要求大户型。","sides":[{"id":"enclosure-L","label":"周围留开","headline":"坐下，身边还留着余地。","description":"座位前方和侧边留出空间，坐在这里，也能感到周围开阔。","look":"看前景座位之间的空地；后方床位是原案例内容。","ref":18,"sentence":"坐下的地方周围留开，身边还有余地"},{"id":"enclosure-R","label":"身边有靠","headline":"身后有靠，面前仍然敞开。","description":"座位靠近墙边或转角，身后和一侧有边界，前方仍留着视野。","look":"看单椅背后、左侧与前方三处不同的边界。","ref":17,"sentence":"给停留的位置留一个靠边的角落，身后有靠，面前敞开"}]},{"id":"palette","number":"03","name":"什么画面合心意","term":"材色关系","intro":"家具和背景可以接得很近，也可以让几处颜色、纹理从整体里显出来。","scope":"看颜色、纹理之间怎样相处。","boundary":"颜色与纹理可以分别喜欢不同的关系。相融与对比都能用不同预算实现，具体材料和环保要求另行记录。","sides":[{"id":"palette-L","label":"融成一体","headline":"看过去，颜色接得很自然。","description":"沙发、墙面和木色衔接得近，细节慢慢看，整幅画面先连成一体。","look":"看浅色沙发、木墙与背景怎样形成相近的色调。","ref":32,"sentence":"家具与背景的材色衔接得近，让整幅画面融在一起"},{"id":"palette-R","label":"有个重点","headline":"看过去，总有几处让目光停一下。","description":"浅色座椅、木墙和挂画拉开差别，喜欢的部分在整体里看得分明。","look":"看浅色座椅与木墙、挂画之间的层次。","ref":41,"sentence":"在整体搭配里留几处材色差别，让喜欢的部分看得分明"}]},{"id":"lighting","number":"04","name":"光怎样留在家里","term":"光影分布","intro":"歇一会儿时，光可以柔和地铺开，也可以在停留的位置亮起来。","scope":"看空间的明暗怎样分布。","boundary":"两张现有案例都有日光，用来说明明暗关系。夜间偏好仍需从夜间场景的回答了解，做事所需照明另行考虑。","sides":[{"id":"lighting-L","label":"光铺开","headline":"坐在哪儿，都在一片柔和的光里。","description":"各处亮度相对接近，整个起居区都能看清，光柔和地铺在周围。","look":"看座位与背景整体可见的明暗关系。此图为日间示意。","ref":71,"sentence":"休息时，让柔和的光铺开，各处都能看清"},{"id":"lighting-R","label":"重点亮起","headline":"这一处亮着，周围慢慢暗下来。","description":"灯光在座位附近形成重点，周围保留柔暗的层次，停留的位置更突出。","look":"看座位周围的局部灯光。此图同时存在窗光。","ref":56,"sentence":"休息时，让停留的位置亮些，周围柔暗一些"}]}]};

 if((mode==='result'||mode==='designer')&&M.report(bank,state).complete&&!I.normal(state.identity).completedAt){const p=I.normal(state.identity);mode='identity';identityStep=p.status==='unprovided'?'type':'avatar';}

  if(!spaceAnswered()){mode='answer';pos=M.route(bank,state.answers).findIndex(q=>q.axis&&!M.valid(q,state.answers[q.id]));return legacyRender();}

 }

}

 finishDevelopment();if(!frame?.isConnected)return;const request=developmentRequest,img=frame.querySelector('.mood-image>img'),box=frame.querySelector('.mood-image'),replay=frame.querySelector('[data-develop-replay]');
 if(!img||!box)return;if(matchMedia('(prefers-reduced-motion: reduce)').matches){frame.dataset.developState='complete';return;}
 if(replay)replay.disabled=true;
 try{await img.decode();}catch{if(replay)replay.disabled=false;frame.dataset.developState='complete';return;}
 if(request!==developmentRequest||!frame.isConnected)return;
 const canvas=document.createElement('canvas');canvas.className='develop-blocks';canvas.setAttribute('aria-hidden','true');const ratio=box.clientWidth/Math.max(1,box.clientHeight);canvas.width=14;canvas.height=Math.max(6,Math.round(14/ratio));const ctx=canvas.getContext('2d');if(!ctx){if(replay)replay.disabled=false;frame.dataset.developState='complete';return;}
